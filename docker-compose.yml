# Local streaming infra: Redpanda (Kafka API) + Console for topic inspection.
#
# Redpanda over Kafka here because it is a single binary with no ZooKeeper/KRaft
# ceremony, starts in seconds, and speaks the same Kafka protocol that Spark's
# Kafka source expects -- so nothing downstream knows the difference. See
# DECISIONS.md D-007.
#
#   docker compose up -d
#   ./scripts/create_topics.sh
#   open http://localhost:8080

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: xstream-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two listeners: `internal` for other containers, `external` for
      # processes on the host. Without the split, a client on the host would
      # receive an advertised address it cannot resolve.
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports:
      - "19092:19092"   # Kafka API, for host processes
      - "18082:18082"   # HTTP proxy
      - "9644:9644"     # admin API / metrics
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  console:
    image: redpandadata/console:v2.7.2
    container_name: xstream-console
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "false"

volumes:
  redpanda-data:
