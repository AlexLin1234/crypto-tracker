[project]
name = "xstream"
version = "0.1.0"
description = "Cross-exchange crypto market data streaming pipeline"
readme = "README.md"
requires-python = ">=3.11"

# Dependencies are promoted from the optional groups below into this list as
# each milestone actually starts importing them, so the list stays an honest
# statement of what the code uses today. Milestones 0-2 are in.
dependencies = [
    "websockets>=13.0",
    "python-dotenv>=1.0",
    "confluent-kafka>=2.15.0",
    "structlog>=26.1.0",
    "sortedcontainers>=2.4.0",
]

[project.optional-dependencies]
# Milestones 3-5: Spark, Parquet, DuckDB
processing = [
    "pyspark>=3.5",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas>=2.2",
]
# Milestone 7: modelling
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
]
# Milestone 8: dashboard
dashboard = [
    "streamlit>=1.36",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xstream"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
